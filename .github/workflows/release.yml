name: Release

# 推 v* tag 构建三平台产物并发 GitHub Release；手动触发只构建，产物留在 Actions 里
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux 产物要 glibc 2.38+：ort 静态链接的预编译 ONNX Runtime 就是照这个版本编的
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkgid=$(cargo pkgid)
          test "${GITHUB_REF_NAME#v}" = "${pkgid##*[#@]}"
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # 把 packaging/homebrew/kwscope.rb 填上版本与 SHA-256，推到 soundadam/homebrew-tap 的 main。
  # 带 `-` 的预发布 tag 不更新 Cask。
  # HOMEBREW_TAP_GITHUB_TOKEN：fine-grained token，只给 soundadam/homebrew-tap 的 Contents: read and write；
  # 自带的 GITHUB_TOKEN 推不了别的仓。
  homebrew:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Render the Cask
        run: |
          version=${GITHUB_REF_NAME#v}
          sha() { sha256sum "dist/kwscope-$version-$1" | cut -d' ' -f1; }
          sed -e "s/@VERSION@/$version/" \
            -e "s/@MACOS_SHA256@/$(sha macos-universal.zip)/" \
            -e "s/@LINUX_X86_64_SHA256@/$(sha linux-x86_64.tar.gz)/" \
            packaging/homebrew/kwscope.rb >kwscope.rb
          ! grep -n '@[A-Z0-9_]*@' kwscope.rb
      - name: Push to soundadam/homebrew-tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set"; exit 1; }
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/soundadam/homebrew-tap.git" tap
          cp kwscope.rb tap/Casks/kwscope.rb
          cd tap
          git add Casks/kwscope.rb
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "kwscope ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
