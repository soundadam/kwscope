[package]
name = "kwscope"
version = "0.1.0"
edition = "2021"
authors = ["soundadam"]
repository = "https://github.com/soundadam/kwscope"
license = "MIT OR Apache-2.0"
description = "Test wake-word models on a live spectrogram: import ONNX bundles, see triggers shaded"

[dependencies]
appkit = { git = "https://github.com/soundadam/appkit", tag = "rust/v0.3.0", features = ["egui"] }
clap = { version = "4", features = ["derive"] }
claxon = "0.4"
cpal = "0.15"
eframe = { version = "0.29", features = ["wgpu"] }
hound = "3.5"
# 和训练侧同一个推理库；以后的 int8（MatMulInteger、QDQ 图）也跑这个。预编译库静态链接进可执行文件
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24"] }
realfft = "3.4"
rfd = "0.17"
rtrb = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1

# 依赖开优化：debug 构建下 FFT 和绘制也能跑满帧率
[profile.dev.package."*"]
opt-level = 2

# exe 的图标资源只在 Windows 上编进去（build.rs）
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
