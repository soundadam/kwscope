[package]
name = "tonescope"
version = "0.1.1"
edition = "2021"
authors = ["soundadam"]
repository = "https://github.com/soundadam/tonescope"
license = "MIT OR Apache-2.0"
description = "Real-time log-frequency spectrogram with musical scale overlays"

[dependencies]
cpal = "0.15"
eframe = { version = "0.29", features = ["wgpu"] }
realfft = "3.4"
rtrb = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1

# 依赖开优化：debug 构建下 FFT 和绘制也能跑满帧率
[profile.dev.package."*"]
opt-level = 2

# exe 的图标资源只在 Windows 上编进去（build.rs）
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
